spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: ChampionsClubHikariPool-Prod
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.championsclub: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
