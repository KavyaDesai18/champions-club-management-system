spring:
  datasource:
    # Testcontainers provides dynamic properties
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  timezone: Asia/Kolkata
  membership:
    grace-period-days: 0

logging:
  level:
    com.championsclub: DEBUG
    org.testcontainers: INFO
