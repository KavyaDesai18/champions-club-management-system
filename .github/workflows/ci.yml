name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 / Spring Boot / Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify build and run tests (Flyway & Testcontainers)
        run: mvn -B verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: c2VjdXJlSnd0U2VjcmV0S2V5Rm9yQ2hhbXBpb25zQ2x1Yk1hbmFnZW1lbnRTeXN0ZW0yMDI2IQ==
          CLUB_TIMEZONE: Asia/Kolkata
          CORS_ORIGINS: http://localhost:5173

  frontend:
    name: Frontend (React / Vite / Vitest / Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run unit & component tests
        run: npm run test:run

      - name: Build frontend bundle
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1
